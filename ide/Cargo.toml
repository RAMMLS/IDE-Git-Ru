[package]
name = "aura-ide"
version = "0.1.0"
edition = "2021"
description = "Aura graphical IDE with integrated source control"

[dependencies]
aura-control = { path = "../vcs-core" }
iced = { version = "0.12", features = ["tokio", "highlighter"] }
syntect = { version = "5.2", default-features = false, features = ["default-syntaxes", "default-themes", "parsing", "regex-onig"] }
tokio = { version = "1.48", features = ["process"] }
