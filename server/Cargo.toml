[package]
name = "aura-server"
version = "0.1.0"
edition = "2021"

[dependencies]
aura-control = { path = "../vcs-core" }
axum = { version = "0.7", features = ["ws", "macros"] }
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["cors", "fs"] }
uuid = { version = "1.7", features = ["v4", "serde"] }
anyhow = "1.0"
