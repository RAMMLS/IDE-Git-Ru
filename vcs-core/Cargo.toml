[package]
name = "aura-control"
version = "0.1.0"
edition = "2021"
description = "Core version control primitives for the Aura project"
license = "MIT"

[dependencies]
async-recursion = "1.1"
async-trait = "0.1"
bincode = "1.3"
chrono = { version = "0.4", features = ["clock", "std"] }
flate2 = "1.1"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
sha1 = "0.10"
thiserror = "1.0"
tokio = { version = "1.48", features = ["fs", "io-util", "macros", "rt", "time"] }
